name: grindion

services:
  arena:
    build:
      context: .
      target: arena-server
    container_name: grindion-arena
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: grindion-web
    restart: unless-stopped
    depends_on:
      arena:
        condition: service_healthy
    ports:
      - 127.0.0.1:${GRINDION_HTTP_PORT:-8087}:80
